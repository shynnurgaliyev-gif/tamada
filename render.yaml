services:
  - type: web
    name: tamada-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: tamada-api
      - key: APP_PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: WHATSAPP_PROVIDER
        value: stub
      - key: SESSION_EXPIRES_DAYS
        value: 30
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false

  - type: web
    name: tamada-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NEXT_PUBLIC_API_URL
        sync: false
